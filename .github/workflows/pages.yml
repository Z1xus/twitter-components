name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run check
      - name: Build docs
        run: bun run docs:build
        env:
          DOCS_BASE_PATH: /twitter-components
      - name: Upload docs
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
